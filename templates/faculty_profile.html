<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>Profile Settings - Smart Attendance System</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='bootstrap/css/bootstrap.min.css') }}">
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
	<link rel="stylesheet" href="{{ url_for('static', filename='fonts/themify-icons.css') }}">
	<style>
		/* Profile Specific Styles */
		.profile-img-container { text-align: center; margin-bottom: 30px; }
		.profile-img-container img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary-color); margin-bottom: 15px; }
	</style>
<link rel="stylesheet" href="{{ url_for('static', filename='css/faculty.css') }}">
</head>
<body>
	{% include 'components/faculty_sidebar.html' %}

	<main class="main-content" id="main-content">
		{% include 'components/admin_header.html' %}
		
		<div class="dashboard-container">
			{% include 'components/Error_Show.html' %}
			<div class="page-title">
				<h2>Profile Settings</h2>
			</div>

			<div class="row justify-content-center">
				<div class="col-lg-8">
					<div class="table-card">
						<div class="card-body">
							<form action="{{ url_for('faculty_profile_update') }}" method="POST" enctype="multipart/form-data">
								<div class="profile-img-container">
									<img src="{{ session.get('profile_img', '/assets/img/Users/Faculty/Default.jpg') }}" alt="Profile" id="previewImg">
									<div>
										<label for="profile_img" class="btn btn-sm btn-outline-dark mt-2">Change Picture</label>
										<input type="file" id="profile_img" name="profile_img" class="d-none" accept="image/*" onchange="previewImage(event)">
									</div>
								</div>

								<div class="row">
									<div class="col-md-6 mb-3">
										<label class="form-label">Full Name</label>
										<input type="text" class="form-control" name="full_name" value="{{ session.get('full_name', '') }}" required>
									</div>
									<div class="col-md-6 mb-3">
										<label class="form-label">Email (Read Only)</label>
										<input type="email" class="form-control" value="{{ session.get('email', '') }}" readonly>
										<small class="text-muted d-block mt-1">Email cannot be changed here.</small>
									</div>
								</div>
								
								<div class="text-end mt-4">
									<button type="submit" class="btn btn-custom">Save Changes</button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		$(document).ready(function () {
			$('#mobile-toggle').click(function () {
				$('#sidebar').toggleClass('active');
			});
		});

		function previewImage(event) {
			const reader = new FileReader();
			reader.onload = function(){
				const output = document.getElementById('previewImg');
				output.src = reader.result;
			};
			reader.readAsDataURL(event.target.files[0]);
		}
	</script>
</body>
</html>
