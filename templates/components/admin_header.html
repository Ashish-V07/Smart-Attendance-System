<style>
	.user-profile {
		display: flex;
		align-items: center;
		cursor: pointer;
	}

	.user-profile img {
		width: 40px;
		height: 40px;
		border-radius: 50%;
		margin-right: 10px;
		object-fit: cover;
	}
</style>
<header class="top-header">
	<div class="d-flex align-items-center">


	</div>

	<div class="header-actions">

		<div class="user-profile dropdown" data-bs-toggle="dropdown" aria-expanded="false" style="cursor: pointer;">
			<img src="{{ session.get('profile_img', '/assets/img/Users/Admin/Admin.jpg') }}" alt="Admin">
			<div class="user-info d-none d-sm-block">
				<span style="font-weight: 600; font-size: 14px; color: #333;">{{ session.get('full_name', 'Admin User')
					}} <i class="ti-angle-down" style="font-size: 12px; margin-left: 5px;"></i></span>
			</div>
		</div>
		<ul class="dropdown-menu dropdown-menu-end shadow border-0" style="border-radius: 8px; margin-top: 10px;">
			<li><a class="dropdown-item py-2"
					href="{% if session.get('role_id') == 3 %}{{ url_for('student_profile') }}{% elif session.get('role_id') == 2 %}{{ url_for('faculty_profile') }}{% else %}{{ url_for('admin_profile') }}{% endif %}"><i
						class="ti-settings me-2"></i>
					Profile Settings</a></li>
			<li>
				<hr class="dropdown-divider">
			</li>
			<li><a class="dropdown-item py-2 text-danger" href="{{ url_for('logout') }}"><i
						class="ti-power-off me-2"></i> Logout</a></li>
		</ul>
	</div>
</header>
